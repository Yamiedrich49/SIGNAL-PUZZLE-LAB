(--muted);margin:0 0 10px}.card-foot{display:flex;gap:9px;align-items:center;justify-content:space-between}.mini-progress{font-size:11px;color:#768f96;font-weight:700}.play{border:0;background:#193c46;color:#fff;border-radius:22px;padding:10px 16px;font-size:12px;font-weight:800}.play:hover,.primary:hover{filter:brightness(1.1)}.note{font-size:11px;color:#84999c;margin:18px 5px;line-height:1.8}.lower-actions{margin:20px 0 4px;display:flex;justify-content:center}.secondary{background:#fff;border:1px solid var(--line);border-radius:24px;padding:11px 18px;color:#36545c;font-weight:800;font-size:12px}.back{display:flex;align-items:center;gap:5px;color:#3c6167;font-weight:800;font-size:12px;border:0;background:transparent;padding:6px 0}.gameHead{padding-top:14px}.gameTitleRow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:9px 0 6px}.gameTitle{font-size:29px;line-height:1.2;letter-spacing:-.045em;font-weight:900;margin:0}.stage{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--teal);background:#deefec;border-radius:30px;padding:7px 10px;white-space:nowrap}.gameIntro{font-size:12px;color:var(--muted);line-height:1.8;min-height:21px}.dots{display:flex;gap:6px;align-items:center;margin:15px 0 18px}.dot{width:100%;height:6px;border:0;border-radius:8px;background:#d9e4e3;padding:0;max-width:50px}.dot.done{background:#46bba9}.dot.active{background:#173f4a}.dot.locked{opacity:.65;cursor:default}.playpanel{background:#fff;border:1px solid #e3ebe9;border-radius:23px;padding:16px;box-shadow:var(--shadow)}.panel-label{font-size:10px;letter-spacing:.1em;font-weight:850;color:var(--muted);display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}.wave-canvas{display:block;width:100%;height:155px;border-radius:15px;background:#102b35}.wave-canvas.candidate{height:65px;background:#eaf7f4}.waveOptions{margin:15px 0 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.waveChoice{border:1.5px solid #d8 isplay:grid;place-items:center;position:relative;min-height:0;min-width:0}.cell:before{content:"";width:9px;height:9px;border-radius:50%;background:#45646b;transition:all .13s}.cell.filled:before{width:19px;height:19px;background:#ffdb91;box-shadow:0 0 0 4px #ffdb9127,0 0 20px #f6c87967}.cell.fixed:before{background:#8ce9db;box-shadow:0 0 0 4px #8ce9db20,0 0 17px #8ce9db60}.cell.block:before{width:13px;height:13px;background:#28414b;border-radius:5px;transform:rotate(45deg)}.packOverlay{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);z-index:0;pointer-events:none}.packMeta{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 2px;color:#608186;font-size:11px;font-weight:750}.packCount{color:#0e6570;font-size:15px;font-weight:900}.complete{border-radius:13px;background:#e4f7ee;padding:12px 13px;text-align:center;color:#096e5b;line-height:1.7;font-size:13px;font-weight:850;margin-top:11px}.feedbackBox{margin-top:18px;background:#fff;border:1px solid #e0eae6;padding:18px;border-radius:21px}.feedbackHeader{display:flex;align-items:center;justify-content:space-between;gap:10px}.feedbackHeader strong{font-size:14px}.feedbackHeader small{font-size:11px;color:#81969c}.ratingLabel{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:#577075;margin:14px 0 8px}.stars{display:flex;gap:8px}.ratingStar{background:#edf2f0;color:#9db3b3;border:0;border-radius:10px;width:40px;height:39px;font-size:22px;line-height:39px;text-align:center;padding:0}.ratingStar.on{color:#efad47;background:#fff4dc}.feedbackBox textarea{resize:vertical;min-height:60px;max-height:160px;width:100%;margin-top:10px;border:1px solid #dce7e5;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.7;background:#fbfdfc;color:#18363f}.hiddenTech{border-top:1px solid #e7eeec;padding-top:13px;margin-top:18px;font-size:11px;line-height:1.9;color:#627b80}.hiddenTech summary{color:#69888a;cursor:pointer;font-weight:800;list-style-position:inside}.comparison{background:#fff;border:1px solid #e0e9e7;border-radius:21px;padding:18px}.compareRow{padding:13px 0;border-bottom:1px solid #e6edeb;display:flex;justify-content:space-between;align-items:center;gap:10px}.compareRow:last-of-type{border-bottom:0}.compareTitle{font-size:14px;font-weight:800}.compareStats{color:#688287;font-size:12px;text-align:right;line-height:1.6}.compareNote{color:#769094;font-size:11px;margin-top:5px;white-space:pre-wrap;word-break:break-all}.copyMsg{font-size:12px;color:var(--teal);margin-top:10px;min-height:22px;text-align:center}.footer{text-align:center;color:#9aabaa;font-size:10px;padding:24px 0 9px;letter-spacing:.1em}.confetti{animation:pop .45s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:scale(1);opacity:1}}@media(min-width:520px){#root{padding-left:24px;padding-right:24px}.cards{grid-template-columns:1fr 1fr}.card-main{display:flex;flex-direction:column;align-items:stretch}.card-main .art{width:100%;height:130px}.card-main .art svg{height:100%;width:100%}.card-foot{margin-top:auto}}@media(max-width:360px){#root{padding-left:12px;padding-right:12px}.card-main{grid-template-columns:94px 1fr;gap:11px;padding:13px}.art{width:94px;height:94px}.card h2{font-size:18px}.gameTitle{font-size:26px}.playpanel{padding:12px}.waveChoice{padding:6px 1px}.waveThumb{height:26px}.ratingStar{width:38px;height:37px}.wave-canvas{height:130px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body><main id="root"></main>
<script>
(()=>{'use strict';
const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
const KEY='signalPuzzleLab_v1';
const definitions=[
 {id:'waves',num:'01',name:'波ほどき',short:'重なった線の中から、もとの波を見つける。',hint:'波のかたちを見て、隠れた波を選ぼう。',tech:'いくつもの異なる周期の波が、一つの信号として重なっている。OFDMにつながる「周波数ごとの成分を取り出す」発想を、位相や変調を省略して体験する試作。'},
 {id:'restore',num:'02',name:'星もどし',short:'ずれてしまった星座を、ひとつの操作で戻す。',hint:'光る星を動かして、うすい星と重ねよう。',tech:'受信した信号点の配置全体に同じ回転やずれが生じることがある。QAMのコンスタレーション補正に着想を得た、回転と平行移動のパズル。'},
 {id:'space',num:'03',name:'星の余白',short:'星がぶつからない配置を、限られた場所に作る。',hint:'星を離して置き、きれいな配置を探そう。',tech:'QAMなどの多値変調では、信号点を詰め込むと情報量が増える一方、雑音で判別しにくくなる。点同士の最小距離を守るという配置問題に置き換えた試作。'}
];
const waveStages=[[0],[2],[0,2],[1,3],[0,2,4],[1,2,4],[0,1,3],[0,1,2,4]];
const starPatterns=[
{p:[[-1,-1],[0,-1],[1,-1],[1,0],[1,1]],a:0,dx:.18,dy:-.12},
{p:[[-2,0],[-1,0],[0,0],[0,1],[1,1]],a:90,dx:-.12,dy:.13},
{p:[[-1,-1],[0,-1],[0,0],[1,0],[1,1]],a:-90,dx:.14,dy:.15},
{p:[[-2,-1],[-1,-1],[0,0],[1,0],[1,1]],a:135,dx:-.08,dy:-.1},
{p:[[-2,0],[-1,0],[0,0],[1,-1],[1,-2]],a:180,dx:.14,dy:.09},
{p:[[-1,-2],[-1,-1],[0,0],[1,0],[1,1]],a:45,dx:-.16,dy:.14},
{p:[[-2,1],[-1,1],[0,0],[1,0],[1,-1],[2,-1]],a:-135,dx:.12,dy:-.12},
{p:[[-1,-1],[0,-2],[0,-1],[1,0],[2,0],[2,1]],a:225,dx:.07,dy:.11}
];
const packStages=[
{k:3,d:10,b:[],f:[]},
{k:4,d:13,b:[],f:[]},
{k:5,d:8,b:[],f:[]},
{k:4,d:9,b:[0,24],f:[4]},
{k:4,d:10,b:[12],f:[4]},
{k:5,d:5,b:[4,20],f:[12]},
{k:6,d:5,b:[],f:[]},
{k:5,d:6,b:[6,18],f:[0]}
];
const counts={waves:waveStages.length,restore:starPatterns.length,space:packStages.length};
const defaultRecord=()=>({done:[],fun:0,insight:0,note:''});
let records={waves:defaultRecord(),restore:defaultRecord(),space:defaultRecord()}, route='home', currentStage=0, success=false, waveSelection=[],restorePosition=null,packSelection=[],lastWaveFeedback='';
try{const loaded=JSON.parse(localStorage.getItem(KEY)||'{}'); for(const d of definitions){const x=loaded[d.id];if(x&&typeof x==='object')records[d.id]={...defaultRecord(),...x,done:Array.isArray(x.done)?x.done:[]};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));}catch(e){}}
function completed(d){return (records[d].done||[]).filter(v=>v>=0&&v<counts[d]).length}
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let audio=null,soundOn=true;
function initAudio(){if(!soundOn)return null;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio;}catch(e){return null}}
function tone(freq=440,duration=.13,vol=.055,delay=0){const ctx=initAudio();if(!ctx)return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+duration+.02)}
function tick(index=0){tone([392,440,494,523,587][index%5],.105,.032)}
function winSound(){[261.63,329.63,392,523.25].forEach((f,i)=>tone(f,.58,.038,i*.055))}
function header(tag='PROTOTYPE / 2026'){return `<header class="top"><div class="brand"><span class="brand-mark">✦</span> PLAY LAB</div><div class="top-tag">${tag}</div></header>`}
function cardArt(id){if(id==='waves')return `<svg viewBox="0 0 110 110" aria-hidden="true"><path d="M2 55 Q15 12 29 55 T56 55 T83 55 T110 55" fill="none" stroke="#399b9a" stroke-width="3" stroke-linecap="round"/><path d="M2 55 Q9 82 16 55 T44 55 T72 55 T100 55" fill="none" stroke="#76c6b2" stroke-width="3" stroke-linecap="round"/><path d="M2 55 C15 0 24 108 41 55 S69 0 83 55 S96 108 110 55" fill="none" stroke="#1b677b" stroke-width="3.5" stroke-linecap="round"/></svg>`;
if(id==='restore')return `<svg viewBox="0 0 110 110" aria-hidden="true"><path d="M20 28L38 51 67 35 86 67 56 86" fill="none" stroke="#b3a4e9" stroke-width="2" stroke-dasharray="4 5"/><path d="M28 36L46 59 75 43 94 75 64 94" fill="none" stroke="#8e76ce" stroke-width="2"/>${[[20,28],[38,51],[67,35],[86,67],[56,86]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" stroke="#957fcf" fill="none" stroke-width="2"/>`).join('')}${[[28,36],[46,59],[75,43],[94,75],[64,94]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#7b61be"/>`).join('')}</svg>`;
return `<svg viewBox="0 0 110 110" aria-hidden="true">${[18,42,66,90].flatMap(x=>[18,42,66,90].map(y=>`<circle cx="${x}" cy="${y}" r="2.2" fill="#ddb77b"/>`)).join('')}<circle cx="18" cy="18" r="16" fill="#eac17f35" stroke="#e4a842"/><circle cx="90" cy="18" r="16" fill="#eac17f35" stroke="#e4a842"/><circle cx="18" cy="90" r="16" fill="#eac17f35" stroke="#e4a842"/><circle cx="90" cy="90" r="16" fill="#eac17f35" stroke="#e4a842"/>${[[18,18],[90,18],[18,90],[90,90]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#d29237"/>`).join('')}</svg>`}
function home(){route='home';document.title='PLAY LAB — 小さな発見の実験室';const total=definitions.reduce((s,d)=>s+completed(d.id),0);$('#root').innerHTML=header('EXPERIMENTS / 03')+`<section class="hero"><div class="eyebrow">SMALL GAMES, BIG IDEAS.</div><h1>遊んで、見つける。<br>小さな実験室。</h1><p>まだ完成していない3つの遊び。<br>ひとつずつ触って、面白い芽を探そう。</p></section><div class="tinylabel">EXPERIMENTS &nbsp; / &nbsp; ${total} STAGES CLEARED</div><div class="cards">${definitions.map(d=>`<article class="card"><div class="card-main"><div class="art ${d.id==='waves'?'a':d.id==='restore'?'b':'c'}">${cardArt(d.id)}</div><div style="display:flex;flex-direction:column;flex:1"><div class="number">EXPERIMENT ${d.num}</div><h2>${d.name}</h2><p>${d.short}</p><div class="card-foot"><span class="mini-progress">${completed(d.id)} / ${counts[d.id]} クリア${records[d.id].fun?' · ♥ '+records[d.id].fun+'/5':''}</span><button class="play" data-play="${d.id}">あそぶ ↗</button></div></div></div></article>`).join('')}</div><div class="lower-actions"><button class="secondary" id="compare">評価ノートを見る ↗</button></div><p class="note">各ゲームの下から「面白さ」と「ひらめき」を5段階で評価できる。結果はこの端末に保存されるよ。</p><div class="footer">PLAY LAB · EXPERIMENTAL BUILDS</div>`;
$$('[data-play]').forEach(b=>b.onclick=()=>openGame(b.dataset.play,0));$('#compare').onclick=comparison;window.scrollTo(0,0)}
function openGame(id,stage){route=id;currentStage=Math.max(0,Math.min(counts[id]-1,stage));success=false;waveSelection=[];packSelection=[];lastWaveFeedback='';let d=definitions.find(x=>x.id===id);document.title=d.name+' — PLAY LAB';const done=records[id].done||[];$('#root').innerHTML=header('EXPERIMENT / '+d.num)+`<div class="gameHead"><button class="back" id="back">‹ &nbsp;実験室にもどる</button><div class="gameTitleRow"><h1 class="gameTitle">${d.name}</h1><span class="stage">${String(currentStage+1).padStart(2,'0')} / ${String(counts[id]).padStart(2,'0')}</span></div><div class="gameIntro">${d.hint}</div></div><div class="dots">${Array.from({length:counts[id]},(_,i)=>`<button class="dot ${done.includes(i)?'done':''} ${i===currentStage?'active':''} ${i>Math.max(0,...done.map(v=>v+1))?'locked':''}" data-stage="${i}" title="${i+1}問目" aria-label="${i+1}問目"></button>`).join('')}</div><div id="game"></div>${ratingHTML(d)}<div class="footer">PLAY LAB · ${d.num}</div>`;$('#back').onclick=home;$$('[data-stage]').forEach(b=>b.onclick=()=>{const n=+b.dataset.stage;if(n<=Math.max(0,...records[id].done.map(v=>v+1)))openGame(id,n)});bindRatings(id);if(id==='waves')renderWaves();else if(id==='restore')renderRestore();else renderSpace();window.scrollTo(0,0)}
function ratingHTML(d){const v=records[d.id];return `<section class="feedbackBox"><div class="feedbackHeader"><strong>この遊び、どうだった？</strong><small>評価は自動保存</small></div>${[['fun','面白さ'],['insight','ひらめき']].map(([key,label])=>`<div class="ratingLabel"><span>${label}</span><span id="${key}Score">${v[key] ? v[key]+' / 5' : '未評価'}</span></div><div class="stars" data-kind="${key}">${[1,2,3,4,5].map(n=>`<button aria-label="${label} ${n}点" class="ratingStar ${v[key]>=n?'on':''}" data-score="${n}">★</button>`).join('')}</div>`).join('')}<textarea id="memo" maxlength="450" placeholder="メモ：面白かったところ、つまらなかったところ…">${safe(v.note)}</textarea><details class="hiddenTech"><summary>この遊びの裏にある数学・通信のしくみ</summary><div>${d.tech}</div></details></section>`}
function bindRatings(id){$$('.ratingStar').forEach(b=>b.onclick=()=>{const kind=b.parentElement.dataset.kind;records[id][kind]=+b.dataset.score;save();const group=b.parentElement;$$('button',group).forEach(x=>x.classList.toggle('on',+x.dataset.score<=records[id][kind]));$('#'+kind+'Score').textContent=records[id][kind]+' / 5';tick(kind==='fun'?1:2)});$('#memo').addEventListener('input',e=>{records[id].note=e.target.value;save()})}
function setStatus(message='',type=''){$('#status').textContent=message;$('#status').className='gameStatus '+type}
function markWin(){success=true;if(!records[route].done.includes(currentStage)){records[route].done.push(currentStage);save()}winSound();$$('.dot').forEach((d,i)=>{if(i===currentStage)d.classList.add('done')});const btn=$('#check');if(btn){btn.textContent=currentStage===counts[route]-1?'実験室にもどる ↗':'次の問題へ →';btn.onclick=()=>currentStage===counts[route]-1?home():openGame(route,currentStage+1)}setStatus('ぴったり！ きれいにできた ✦','good')}
function canvasSetup(el){const b=el.getBoundingClientRect(),d=Math.min(2.5,window.devicePixelRatio||1),w=Math.max(10,b.width),h=Math.max(10,b.height);el.width=Math.round(w*d);el.height=Math.round(h*d);const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);return {c,w,h}}
function drawWave(el,indices,light=false){if(!el)return;const {c,w,h}=canvasSetup(el);c.clearRect(0,0,w,h);const mid=h*.5;const gap=w/8;c.strokeStyle=light?'#cce5de':'#28515a';c.lineWidth=1;for(let i=1;i<8;i++){let x=i*gap;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}c.beginPath();c.moveTo(0,mid);c.lineTo(w,mid);c.stroke(); if(!indices?.length)return;const amplitude=light?.28:.34;c.strokeStyle=light?'#149a8e':'#9be8d8';c.lineWidth=light?2.8:3;c.lineJoin='round';c.lineCap='round';c.beginPath();for(let i=0;i<=240;i++){const t=i/240,x=t*w;let s=0;for(let k of indices)s+=Math.sin(2*Math.PI*(k+1)*t);const y=mid-s/indices.length*h*amplitude;if(i===0)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke()}
function drawThumb(el,f){if(!el)return;const {c,w,h}=canvasSetup(el);c.clearRect(0,0,w,h);c.strokeStyle=el.parentElement.classList.contains('on')?'#087e7c':'#7a9d9e';c.lineWidth=2.1;c.lineCap='round';c.beginPath();for(let i=0;i<=100;i++){const x=i*w/100,y=h/2-Math.sin(2*Math.PI*(f+1)*i/100)*h*.3;if(i===0)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke()}
function renderWaves(){const target=waveStages[currentStage];$('#game').innerHTML=`<div class="playpanel"><div class="panel-label"><span>HIDDEN WAVE</span><span>${target.length}つの波が重なっている</span></div><canvas id="targetWave" class="wave-canvas" aria-label="重なった波"></canvas><div class="panel-label" style="margin-top:18px"><span>どの波がかくれている？</span><span id="selectedCount">0 / ${target.length}</span></div><div class="waveOptions">${Array.from({length:5},(_,i)=>`<button class="waveChoice" aria-label="波 ${i+1}" data-wave="${i}"><canvas class="waveThumb"></canvas><span class="waveName">${i+1}</span></button>`).join('')}</div><div id="guessSection" class="wave-guess"><div class="panel-label"><span>YOUR MIX</span></div><canvas id="guessWave" class="wave-canvas candidate"></canvas></div><div id="status" class="gameStatus">波を選んで、ためそう</div><div class="actionRow"><button class="primary" id="check">この波でためす →</button><button class="secondary small" id="reset">消す</button></div></div><div class="under">タップで波を重ねる。選び直して何度でも試せる。</div>`;const paint=()=>{drawWave($('#targetWave'),target);$$('.waveChoice').forEach(b=>drawThumb($('canvas',b),+b.dataset.wave));if($('#guessSection').classList.contains('show'))drawWave($('#guessWave'),waveSelection,true)};$$('.waveChoice').forEach(b=>b.onclick=()=>{if(success)return;const n=+b.dataset.wave;if(waveSelection.includes(n))waveSelection=waveSelection.filter(k=>k!==n);else if(waveSelection.length<target.length)waveSelection.push(n);else{setStatus(`波は${target.length}つまで。ひとつ外してみよう。`,'bad');return;}b.classList.toggle('on',waveSelection.includes(n));$('#selectedCount').textContent=waveSelection.length+' / '+target.length;tick(n);$('#guessSection').classList.remove('show');setStatus('');paint()});$('#reset').onclick=()=>{if(success){openGame('waves',currentStage);return}waveSelection=[];$$('.waveChoice').forEach(b=>b.classList.remove('on'));$('#selectedCount').textContent='0 / '+target.length;$('#guessSection').classList.remove('show');setStatus('波を選んで、ためそう');paint()};$('#check').onclick=()=>{if(success)return;if(waveSelection.length!==target.length){setStatus(`${target.length}つ選ぼう`,'bad');return}$('#guessSection').classList.add('show');paint();if(waveSelection.length===target.length&&target.every(x=>waveSelection.includes(x))){markWin()}else{const overlap=waveSelection.filter(x=>target.includes(x)).length;setStatus(`おしい！ ${target.length}つのうち ${overlap}つ合っている。`,'bad');tone(220,.17,.035)}};paint();window.onresize=()=>{if(route==='waves')requestAnimationFrame(paint)}}
function rotatePoint([x,y],deg){const a=deg*Math.PI/180;return [x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)]}
function renderRestore(){const s=starPatterns[currentStage];restorePosition={dx:s.dx,dy:s.dy,a:s.a};$('#game').innerHTML=`<div class="playpanel"><div class="panel-label"><span>STARS / RESTORE</span><span>ドラッグ ＋ 回転</span></div><canvas class="starCanvas" id="starBoard" aria-label="ドラッグして星座を動かす"></canvas><div class="rotateArea"><button class="rot" id="rotateL" aria-label="左に45度回す">↶</button><span class="dragHelp">星をなぞって動かす<br>↶ ↷ で回す</span><button class="rot" id="rotateR" aria-label="右に45度回す">↷</button></div><div id="status" class="gameStatus">淡い星と、光る星を重ねよう</div><div class="actionRow"><button class="primary" id="check">重なった？ →</button><button class="secondary small" id="reset">もどす</button></div></div><div class="under">ひとつひとつではなく、星座まるごと動く。</div>`;const board=$('#starBoard');function draw(){const {c,w,h}=canvasSetup(board),u=Math.min(w,h),cx=w/2,cy=h/2,scale=u*.137;c.clearRect(0,0,w,h);c.fillStyle='#284260';for(let ix=0;ix<8;ix++)for(let iy=0;iy<8;iy++){c.beginPath();c.arc((ix+.5)*w/8,(iy+.5)*h/8,.85,0,Math.PI*2);c.fill()}
 function path(points,color,width){c.beginPath();for(let j=0;j<points.length;j++){const p=points[j];if(j===0)c.moveTo(p[0],p[1]);else c.lineTo(p[0],p[1])}c.strokeStyle=color;c.lineWidth=width;c.stroke()}
 const targetPts=s.p.map(([x,y])=>[cx+x*scale,cy+y*scale]); const ownPts=s.p.map(p=>{const q=rotatePoint(p,restorePosition.a);return[cx+restorePosition.dx*u+q[0]*scale,cy+restorePosition.dy*u+q[1]*scale]});path(targetPts,'#88a1b355',2);targetPts.forEach(([x,y])=>{c.beginPath();c.arc(x,y,9,0,Math.PI*2);c.strokeStyle='#a2b6d5';c.lineWidth=2;c.stroke();c.beginPath();c.arc(x,y,2,0,Math.PI*2);c.fillStyle='#89a2c6';c.fill()});path(ownPts,'#ffd99a9c',2.5);ownPts.forEach(([x,y])=>{c.beginPath();c.arc(x,y,11,0,Math.PI*2);c.fillStyle='#e8c07f2b';c.fill();c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fillStyle='#ffe8b4';c.fill()})}
 const change=(d)=>{if(success)return;restorePosition.a=(restorePosition.a+d+360)%360;tick(d>0?2:0);draw();setStatus('')};$('#rotateL').onclick=()=>change(-45);$('#rotateR').onclick=()=>change(45);$('#reset').onclick=()=>{if(success){openGame('restore',currentStage);return}restorePosition={dx:s.dx,dy:s.dy,a:s.a};draw();setStatus('はじめの位置にもどした')};let drag=null;board.onpointerdown=e=>{if(success)return;board.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:restorePosition.dx,dy:restorePosition.dy};tick(0)};board.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;let b=board.getBoundingClientRect(),u=Math.min(b.width,b.height);restorePosition.dx=Math.max(-.5,Math.min(.5,drag.dx+(e.clientX-drag.x)/u));restorePosition.dy=Math.max(-.5,Math.min(.5,drag.dy+(e.clientY-drag.y)/u));draw();setStatus('')};board.onpointerup=board.onpointercancel=e=>{if(drag?.id===e.pointerId)drag=null};$('#check').onclick=()=>{if(success)return;let max=0;for(const p of s.p){const q=rotatePoint(p,restorePosition.a),dx=restorePosition.dx+q[0]*.137-p[0]*.137,dy=restorePosition.dy+q[1]*.137-p[1]*.137;max=Math.max(max,Math.hypot(dx,dy))}if(max<.043){markWin()}else if(max<.12){setStatus('あと少し！ かなり近い。','bad');tone(300,.14,.03)}else{setStatus('まだずれている。回す？ 動かす？','bad');tone(240,.14,.03)}};draw();window.onresize=()=>{if(route==='restore')requestAnimationFrame(draw)}}
function dist2(a,b){return (a%5-b%5)**2+(Math.floor(a/5)-Math.floor(b/5))**2}
function renderSpace(){const s=packStages[currentStage];packSelection=[...s.f];$('#game').innerHTML=`<div class="playpanel"><div class="panel-label"><span>STARS / SPACE</span><span>5 × 5</span></div><div class="packHint">星を <b>${s.k}こ</b> 置こう。<br>光の輪が重ならないように。</div><div class="packWrap"><svg id="packOverlay" class="packOverlay" viewBox="0 0 500 500" aria-hidden="true"></svg><div class="packGrid">${Array.from({length:25},(_,i)=>`<button class="cell ${s.b.includes(i)?'block':''} ${s.f.includes(i)?'fixed':''}" data-cell="${i}" aria-label="${i%5+1}列 ${Math.floor(i/5)+1}行" ${s.b.includes(i)||s.f.includes(i)?'disabled':''}></button>`).join('')}</div></div><div class="packMeta"><span>● あおい星は動かせない</span><span class="packCount" id="packCount">${packSelection.length} / ${s.k}</span></div><div id="status" class="gameStatus">マスをタップして星を置こう</div><div class="actionRow"><button class="primary" id="check">この配置でためす →</button><button class="secondary small" id="reset">消す</button></div></div><div class="under">近い星ほど、光の輪が重なる。どこに置けば離せる？</div>`;function draw(){const o=$('#packOverlay');const r=Math.sqrt(s.d)*50;let svg='';for(const i of packSelection){const x=(i%5+.5)*100,y=(Math.floor(i/5)+.5)*100;svg+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${s.f.includes(i)?'#83dbce':'#f7d48b'}" fill-opacity=".035" stroke="${s.f.includes(i)?'#78c8bb':'#f4c776'}" stroke-opacity=".30" stroke-width="2"/>`}
 let near=null;for(let a=0;a<packSelection.length;a++)for(let b=a+1;b<packSelection.length;b++){let d=dist2(packSelection[a],packSelection[b]);if(d<s.d&&(!near||d<near.d))near={i:packSelection[a],j:packSelection[b],d}}
 if(near){let x1=(near.i%5+.5)*100,y1=(Math.floor(near.i/5)+.5)*100,x2=(near.j%5+.5)*100,y2=(Math.floor(near.j/5)+.5)*100;svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff917e" stroke-width="5" stroke-dasharray="9 8" stroke-linecap="round"/>`}
 o.innerHTML=svg;$$('[data-cell]').forEach(b=>b.classList.toggle('filled',packSelection.includes(+b.dataset.cell)&&!s.f.includes(+b.dataset.cell)));$('#packCount').textContent=packSelection.length+' / '+s.k;return near}
 $$('[data-cell]').forEach(b=>b.onclick=()=>{if(success)return;const i=+b.dataset.cell;if(packSelection.includes(i)){packSelection=packSelection.filter(x=>x!==i)}else if(packSelection.length<s.k)packSelection.push(i);else{setStatus('星をひとつ外してから、置き直そう','bad');return}tick(i%5);draw();setStatus('')});$('#reset').onclick=()=>{if(success){openGame('space',currentStage);return}packSelection=[...s.f];draw();setStatus('')};$('#check').onclick=()=>{if(success)return;if(packSelection.length!==s.k){setStatus(`あと ${s.k-packSelection.length} こ、星を置こう`,'bad');return}const near=draw();if(!near){markWin()}else{setStatus('輪が重なっている星がある。もっと離してみよう。','bad');tone(230,.14,.03)}};draw()}
function comparison(){route='comparison';document.title='評価ノート — PLAY LAB';$('#root').innerHTML=header('EVALUATION / 03')+`<div class="gameHead"><button class="back" id="back">‹ &nbsp;実験室にもどる</button><div class="gameTitleRow"><h1 class="gameTitle">評価ノート</h1></div><p class="sub">どれが本当に面白かった？ 数字とメモで比較する。</p></div><div class="comparison" style="margin-top:22px">${definitions.map(d=>{let x=records[d.id];return `<div class="compareRow"><div><div class="number">EXP ${d.num}</div><div class="compareTitle">${d.name}</div><div class="compareNote">${safe(x.note||'メモなし')}</div></div><div class="compareStats">面白さ　${x.fun||'–'} / 5<br>ひらめき ${x.insight||'–'} / 5<br>${completed(d.id)} / ${counts[d.id]} クリア</div></div>`}).join('')}<button class="primary" id="copy" style="width:100%;margin-top:19px">評価メモをコピー ↗</button><div class="copyMsg" id="copyMsg"></div></div><p class="note">評価はこの端末のブラウザに保存される。次の開発に引き継ぐときは「評価メモをコピー」して送ってね。</p><div class="footer">PLAY LAB · EXPERIMENTAL BUILDS</div>`;$('#back').onclick=home;$('#copy').onclick=async()=>{const content=['PLAY LAB 評価ノート',...definitions.map(d=>{let v=records[d.id];return `${d.num} ${d.name}\nクリア ${completed(d.id)}/${counts[d.id]}｜面白さ ${v.fun||'未評価'}/5｜ひらめき ${v.insight||'未評価'}/5\nメモ：${v.note||'なし'}`})].join('\n\n');let ok=false;try{await navigator.clipboard.writeText(content);ok=true}catch(e){try{let ta=document.createElement('textarea');ta.value=content;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(err){}}$('#copyMsg').textContent=ok?'コピーしたよ。チャットに貼って評価を共有できる。':'コピーできなかった。Safariでページを開いて試してみて。';}};
home();
window.__playLab={definitions,counts,waveStages,starPatterns,packStages,openGame,home,records,dist2};
})();
