function isValidBand(id,start){const p=session.p,w=p.widths[id];if(start<0||start+w>9)return false;for(let j=start;j<start+w;j++){if(p.blocked.includes(j))return false;for(let k=0;k<session.placed.length;k++)if(k!==id&&session.placed[k]!==null&&j>=session.placed[k]&&j<session.placed[k]+p.widths[k])return false;}return true}
function bandSolved(){const p=session.p;return session.placed.every((v,i)=>v!==null&&p.anchors.filter(k=>k.id===i).every(k=>k.pos>=v&&k.pos<v+p.widths[i]));}
function bandView(){const {p,placed,selected}=session;let slots=Array.from({length:9},(_,i)=>`<div class="bandslot ${p.blocked.includes(i)?'blocked':''}" data-slot="${i}">${p.anchors.filter(a=>a.pos===i).map(a=>`<span class="marker" style="color:${bandColors[a.id]}"></span>`).join('')}</div>`).join('');return `<div class="sheetTop"><b>9つの場所</b><span>しましまは使えない</span></div><div class="bandWrap"><div class="bandlabel"><span>はじまり</span><span>おわり</span></div><div class="bandtrack" id="bandTrack">${slots}${placed.map((s,i)=>s===null?'':`<div class="bandPlaced" data-piece="${i}" style="left:calc(7px + (100% - 14px) * ${s}/9);width:calc((100% - 14px) * ${p.widths[i]}/9 - 3px);background:${bandColors[i]};color:white">${String.fromCharCode(65+i)}</div>`).join('')}</div><div class="bandPieces">${p.widths.map((w,i)=>`<button class="bandPiece" data-piece="${i}" style="color:${bandColors[i]};opacity:${placed[i]===null?1:.30};outline:${selected===i?'1px solid #cbd7cd':'0'};border-radius:11px;" aria-label="帯 ${String.fromCharCode(65+i)} を選ぶ" ${placed[i]!==null?'disabled':''}>${Array.from({length:w},()=>'<i></i>').join('')}<b>${String.fromCharCode(65+i)}</b></button>`).join('')}</div><div class="bandInstruction">帯をドラッグ。色の小さな○を、同じ色の帯に入れよう。</div><div class="bandStatus" id="bandStatus">${placed.filter(x=>x!==null).length} / ${placed.length} 配置</div></div>`}
function bandTarget(e){const track=document.getElementById('bandTrack');if(!track)return null;let rect=track.getBoundingClientRect();const innerWidth=rect.width-14;if(!innerWidth)return null;const x=Math.max(0,Math.min(innerWidth,e.clientX-rect.left-7));return Math.round(x/innerWidth*9-(session.p.widths[session.selected]||1)/2);}
function applyBand(id,position){if(cleared)return;if(position===null||!isValidBand(id,position)){ping(260);const el=document.getElementById('bandStatus');if(el)el.textContent='そこには置けない。';return;}session.placed[id]=position;session.selected=(session.placed.findIndex(v=>v===null)+session.placed.length)%session.placed.length;ping(540+id*70);render();if(bandSolved())win();}
function wireBand(){const track=document.getElementById('bandTrack');let started=null;const bind=(el,id)=>{el.addEventListener('pointerdown',e=>{if(cleared)return;session.selected=id;started={id,x:e.clientX,y:e.clientY};try{el.setPointerCapture(e.pointerId)}catch(err){}});el.addEventListener('pointerup',e=>{if(cleared||!started)return;const was=started;started=null;const rect=track.getBoundingClientRect();if(e.clientY>=rect.top-28&&e.clientY<=rect.bottom+28){let v=Math.max(0,Math.min(9-session.p.widths[id],Math.round(((e.clientX-rect.left-7)/(rect.width-14))*9-session.p.widths[id]/2)));applyBand(id,v);}else if(was.id===id&&Math.abs(e.clientX-was.x)<8&&Math.abs(e.clientY-was.y)<8){session.selected=id;document.querySelectorAll('.bandPiece').forEach(b=>b.style.outline=+b.dataset.piece===id?'1px solid #cbd7cd':'none');}});};document.querySelectorAll('[data-piece]').forEach(el=>bind(el,+el.dataset.piece));track.addEventListener('click',e=>{if(cleared||e.target.closest('[data-piece]'))return;const rect=track.getBoundingClientRect(),id=session.selected;const slot=e.target.closest('[data-slot]');const start=slot?Number(slot.dataset.slot):Math.round(((e.clientX-rect.left-7)/(rect.width-14))*9-session.p.widths[id]/2);const v=Math.max(0,Math.min(9-session.p.widths[id],start));applyBand(id,v);});}
function checkBand(manual){if(bandSolved())win();else if(manual){const el=document.getElementById('bandStatus');if(el)el.textContent='全部置いて、色の○も包もう。';ping(280)}}
// expose safe testing hooks for automated game integrity checks.
window.__playLabTest={games,waveLevels,phaseLevels,bandLevels,bandAllSolutions,makeRepair,waveSample,openGame,enterLevel,stage:()=>level,session:()=>session,game:()=>current,isCleared:()=>cleared,bandSolved,phaseCorrect,repairCorrect,waveScore,updateWaveView,win,home};
window.addEventListener('resize',()=>{if(current==='wave')drawWave()});home();
})();
</script></body></html>
